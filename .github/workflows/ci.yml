name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: VITE_API_BASE_URL=https://gbacpod.com npm run build:prod

  # tests/schema.test.mjs against a real server: init-db.sql on a new and on an
  # existing database, and deleting a user keeps its clients. The check job
  # skips those tests (no database). PostgreSQL 18, as production.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --test tests/schema.test.mjs
        env:
          SCHEMA_TEST_SERVER_URL: postgresql://postgres@127.0.0.1:5432
